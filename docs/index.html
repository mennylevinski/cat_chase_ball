<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
  />
  <title>Cat Chase Ball — Living Room</title>
  <link rel="stylesheet" href="style.css" />
  <script src="game.js" defer></script>
</head>
<body>
  <div class="stage-wrap">
    <canvas id="game" width="1280" height="720" aria-label="Cat Chase Ball Living Room Game"></canvas>
  </div>
  <div class="footer">
    <label class="ctrl-label">
      Cat
      <select id="catSelect" aria-label="Cat breed">
        <option value="tabby">Orange Tabby</option>
        <option value="tuxedo">Tuxedo</option>
        <option value="gray">Gray</option>
        <option value="calico">Calico</option>
        <option value="siamese">Siamese</option>
      </select>
    </label>
    <label class="ctrl-label">
      Toy
      <select id="toySelect" aria-label="Toy type">
        <option value="ball">Blue Ball</option>
        <option value="yarn">Yarn Ball</option>
        <option value="mouse">Toy Mouse</option>
      </select>
    </label>
    <button id="tossBtn" type="button">Toss Toy</button>
    <button id="fsBtn" type="button">Fullscreen</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
</body>
</html>
