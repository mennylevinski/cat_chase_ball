<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
  />
  <title>Cat Chase Ball — Living Room</title>
  <link rel="stylesheet" href="style.css" />
  <script src="game.js" defer></script>
</head>
<body>
  <div class="stage-wrap">
    <canvas id="game" width="1280" height="720" aria-label="Cat Chase Ball Living Room Game"></canvas>
  </div>
  <div class="footer">
    <span>Move mouse / finger · Click or Space: toss · F: fullscreen · Hover top bar or stay still: let cat rest</span>
    <button id="tossBtn" type="button">Toss Ball</button>
    <button id="fsBtn" type="button">Fullscreen</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
</body>
</html>
